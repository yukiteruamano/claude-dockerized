version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (the PR updates
  # both the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Base image tag/digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
